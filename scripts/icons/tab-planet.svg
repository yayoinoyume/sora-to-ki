<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 佔位圖示：兩個同心圓環加右上一個點。刻意畫得中性，換站的人可以直接換掉這個檔
       （gen-icons.mjs 從 scripts/icons/ 產生所有 favicon / PWA 圖）。
       顏色跟著瀏覽器主題：淺色分頁列上暖白會消失，所以預設是近黑、深色主題才換暖白。
       ⚠ gen-icons.mjs 產 favicon.ico 時會把下面那個近黑換成暖白——改顏色要一起看那邊。
       ⚠ 圓環是用 mask 挖出來的：這樣全部只靠 `.s` 的 fill 上色，換色時不會漏掉 stroke。 -->
  <style>
    .s { fill: #0a0a0c; }
    @media (prefers-color-scheme: dark) {
      .s { fill: #f1ece3; }
    }
  </style>
  <defs>
    <mask id="ring" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#000" />
      <circle cx="14" cy="18" r="12.8" fill="#fff" />
      <circle cx="14" cy="18" r="9.6" fill="#000" />
      <circle cx="14" cy="18" r="6.0" fill="#fff" />
      <circle cx="14" cy="18" r="2.8" fill="#000" />
    </mask>
  </defs>
  <!-- 兩個同心圓環 -->
  <rect class="s" width="32" height="32" mask="url(#ring)" />
  <!-- 右上那一點：站上唯一的暖色也只當一個「點」 -->
  <circle class="s" cx="25.0" cy="6.8" r="3.2" />
</svg>
